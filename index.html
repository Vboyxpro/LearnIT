<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyelvtanuló App - Belépés</title>
    <!-- Először betöltjük a frissen létrehozott helyi Supabase motort -->
    <script src="supabase.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1 id="auth-title">Regisztráció</h1>
        
        <form id="auth-form">
            <div class="form-group">
                <label for="email">E-mail cím:</label>
                <input type="email" id="email" required placeholder="valaki@pelda.com">
            </div>
            
            <div class="form-group">
                <label for="password">Jelszó:</label>
                <input type="password" id="password" required placeholder="Minimum 6 karakter">
            </div>
            
            <button type="submit" id="auth-btn">Fiók létrehozása</button>
        </form>
        
        <p id="toggle-auth">Már van fiókom? <span id="auth-mode-link">Belépés</span></p>
        <p id="message" class="message"></p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
